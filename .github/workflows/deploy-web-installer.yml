name: Deploy Web Installer

# Publishes web/ (installer page) plus the release data bundle to GitHub Pages.
#
# The release must contain one zip holding manifest.json, firmware/
# (bootloader.bin, partitions.bin, boot_app0.bin, app.bin, build-info.json),
# sprites-*.pak and forms.pak. The zip may use any file name. A file named
# TamaPoke-Web-Installer-v*.zip is preferred when several zips are attached.
# The packs are not stored in git. Release downloads do not send CORS headers,
# so the workflow copies the firmware and packs next to the installer page.
# A nested folder or Windows backslash paths inside the zip are lifted out.
#
# github-pages is limited to branch "main": run this from main (workflow_dispatch).
# Run: Actions -> Deploy Web Installer -> Run workflow -> branch main -> tag e.g. release-20261022

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose zip contains the firmware and sprite packs (e.g. release-20261022)
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-web-installer
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p download
          if ! gh release download "${TAG}" -R "${{ github.repository }}" \
            --pattern '*.zip' --dir download; then
            echo "Release ${TAG} has no zip asset."
            gh release view "${TAG}" -R "${{ github.repository }}" --json assets --jq '.assets[].name' || true
            exit 1
          fi
          ZIP="$(find download -maxdepth 1 -type f -name 'TamaPoke-Web-Installer-v*.zip' | head -n 1 || true)"
          if [ -z "${ZIP}" ]; then
            mapfile -t ZIPS < <(find download -maxdepth 1 -type f -name '*.zip' | sort)
            if [ "${#ZIPS[@]}" -ne 1 ]; then
              echo "Release ${TAG} needs one zip, or a file named TamaPoke-Web-Installer-v*.zip."
              printf 'Found: %s\n' "${ZIPS[@]:-none}"
              exit 1
            fi
            ZIP="${ZIPS[0]}"
          fi
          echo "Using $(basename "${ZIP}")"
          python3 tools/assemble_site.py "${ZIP}" site --tag "${TAG}"
          python3 tools/check_web.py site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
