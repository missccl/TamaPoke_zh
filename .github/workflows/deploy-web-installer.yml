name: Deploy Web Installer

# Publishes web/ (installer page) plus the release data bundle to GitHub Pages.
#
# The release must contain TamaPoke-Web-Installer-v*.zip holding manifest.json,
# firmware/ (bootloader.bin, partitions.bin, boot_app0.bin, app.bin,
# build-info.json), sprites-*.pak and forms.pak. The packs are not stored in
# git. Release downloads do not send CORS headers, so the workflow copies the
# firmware and packs next to the installer page and publishes that site.
# A nested folder or Windows backslash paths inside the zip are lifted out.
#
# github-pages is limited to branch "main": run this from main (workflow_dispatch).
# Run: Actions -> Deploy Web Installer -> Run workflow -> branch main -> tag e.g. tamapoke-ko-zh

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag that contains TamaPoke-Web-Installer-v*.zip (e.g. tamapoke-ko-zh)
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-web-installer
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p download
          gh release download "${TAG}" -R "${{ github.repository }}" \
            --pattern 'TamaPoke-Web-Installer-v*.zip' --dir download
          ZIP="$(find download -maxdepth 1 -type f -name 'TamaPoke-Web-Installer-v*.zip' | head -n 1)"
          if [ -z "${ZIP}" ]; then
            echo "Release ${TAG} has no TamaPoke-Web-Installer-v*.zip asset."
            exit 1
          fi
          python3 tools/assemble_site.py "${ZIP}" site --tag "${TAG}"
          python3 tools/check_web.py site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
