name: Deploy Web Installer

# Deploys the browser installer package from a GitHub Release zip to GitHub Pages.
#
# The repo github-pages environment is limited to branch "main", so this workflow
# must run from main (workflow_dispatch). Do not rely on release/tag refs — tags
# such as "webinstaller" are blocked by that environment protection rule.
#
# Expected release asset: TamaPoke-Web-Installer-v*.zip from Build-Public.ps1.
#
# Run: Actions → Deploy Web Installer → Run workflow → branch main → tag e.g. webinstaller

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag that contains TamaPoke-Web-Installer-v*.zip (e.g. webinstaller)
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-web-installer
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Resolve release tag
        id: tag
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          if [ -z "${TAG}" ]; then
            echo "Release tag input is required."
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Download web installer zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p download site
          gh release download "${{ steps.tag.outputs.tag }}" -R "${{ github.repository }}" \
            --pattern 'TamaPoke-Web-Installer-v*.zip' --dir download
          ZIP="$(find download -maxdepth 1 -type f -name 'TamaPoke-Web-Installer-v*.zip' | head -n 1)"
          if [ -z "${ZIP}" ]; then
            echo "Release ${{ steps.tag.outputs.tag }} has no TamaPoke-Web-Installer-v*.zip asset."
            exit 1
          fi
          unzip -q "${ZIP}" -d site
          test -f site/index.html
          test -f site/manifest.json
          test -d site/firmware

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
