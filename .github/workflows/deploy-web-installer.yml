name: Deploy Web Installer

# Publishes web/ (installer page) plus the release data bundle to GitHub Pages.
#
# The release must contain TamaPoke-Web-Installer-v*.zip holding manifest.json,
# firmware/ (bootloader.bin, partitions.bin, boot_app0.bin, app.bin,
# build-info.json), and the sprite packs (sprites-*.pak, forms.pak). The packs
# are not stored in git; they are served from the Pages origin because GitHub
# release downloads lack the CORS headers the browser needs.
#
# github-pages is limited to branch "main": run this from main (workflow_dispatch).
# Run: Actions -> Deploy Web Installer -> Run workflow -> branch main -> tag e.g. webinstaller

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag that contains TamaPoke-Web-Installer-v*.zip (e.g. webinstaller)
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-web-installer
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p download site
          cp -r web/. site/
          gh release download "${TAG}" -R "${{ github.repository }}" \
            --pattern 'TamaPoke-Web-Installer-v*.zip' --dir download
          ZIP="$(find download -maxdepth 1 -type f -name 'TamaPoke-Web-Installer-v*.zip' | head -n 1)"
          if [ -z "${ZIP}" ]; then
            echo "Release ${TAG} has no TamaPoke-Web-Installer-v*.zip asset."
            exit 1
          fi
          # zips built on Windows use backslash separators; unzip extracts them but exits 1 (warning)
          unzip -q -o "${ZIP}" -d site || [ $? -eq 1 ]
          python3 tools/check_web.py site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
