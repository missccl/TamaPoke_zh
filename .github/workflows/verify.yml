name: Verify Chinese edition
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install Pillow fonttools
      - run: python tools/check_zh.py
      - run: python tools/gen_forms.py && git diff --exit-code -- forms_data.h
      - run: python tools/gen_form_moves.py && git diff --exit-code -- form_moves_data.h
      - run: python tools/gen_sprite_sizes.py && git diff --exit-code -- sprite_sizes.h
      - run: python tools/check_web.py
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: arduino/setup-arduino-cli@v2
      - run: arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - run: arduino-cli core install esp32:esp32@3.3.8 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - run: arduino-cli lib install "GFX Library for Arduino@1.6.7" "SensorLib@0.4.1" "XPowersLib@0.3.3"
      - run: python tools/build_firmware.py --out build/ci --publish
      - name: Package installer bundle (firmware only; add sprite packs before releasing)
        run: |
          mkdir -p bundle && cp -r web/firmware web/manifest.json bundle/
          rm -f bundle/firmware/tamapoke.bin
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-bundle
          path: bundle
